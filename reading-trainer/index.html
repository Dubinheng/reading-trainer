<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>新世纪 Reading Trainer</title>
</head>
<body>
  <p>正在打开新世纪 Reading Trainer…</p>
  <p><a id="reader-entry-link" href="./ielts-toefl-reader.html">如果没有自动跳转，请点击这里</a></p>
  <script>
    (function () {
      // Keep the cache bump in this one place. Entry parameters and the hash
      // are carried to the real page so assignment links survive the static
      // entry redirect and a refresh.
      var READER_CACHE_VERSION = '20261103-recovery-v1';
      var target = './ielts-toefl-reader.html';
      var params;
      try {
        params = new URLSearchParams(window.location.search || '');
        var blocked = /^(answer|answers|draft|response|responses|viewedvocabids|token|password)$/i;
        Array.from(params.keys()).forEach(function (key) { if (blocked.test(key)) params.delete(key); });
        params.set('v', READER_CACHE_VERSION);
        target += params.toString() ? '?' + params.toString() : '';
      } catch (e) {
        target += '?v=' + encodeURIComponent(READER_CACHE_VERSION);
      }
      target += window.location.hash || '';
      var link = document.getElementById('reader-entry-link');
      if (link) link.href = target;
      window.location.replace(target);
    })();
  </script>
</body>
</html>
